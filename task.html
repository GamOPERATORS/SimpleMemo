<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスクメモ</title>
  <link rel="stylesheet" href="task.css">
</head>
<body>
  <h1>今日のタスク</h1>
  <p>今日やるべきことを入力してください</p>
  
  <!-- タスクの入力欄と追加ボタン -->
  <input type="text" id="task-input" size="30" maxlength="50">
  <button id="add-button">追加する</button>

  <!-- タスクが追加されていくエリア -->
  <ul id="task-list"></ul>

  <script src="task.js"></script>
</body>
</html>
